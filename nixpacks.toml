# nixpacks.toml
[phases.setup]
aptPkgs = [
    "php8.2",
    "php8.2-common",
    "php8.2-mysql",
    "php8.2-pdo",
    "php8.2-opcache",
    "libpng-dev",
    "libzip-dev"
]

[phases.install]
cmds = [
    "docker-php-ext-install pdo pdo_mysql",
    "docker-php-ext-enable pdo_mysql",
    "echo 'PHP extensions installed'"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t public"
